<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Sơ đồ Quy trình AI Agent CRM Minh An (Tải về / Xem trực quan)</title>
  <style>
    body { margin: 0; padding: 20px; background: #f1f5f9; font-family: 'Segoe UI', Arial, sans-serif; display: flex; flex-direction: column; align-items: center; }
    .toolbar { background: white; padding: 12px 24px; border-radius: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); display: flex; gap: 12px; margin-bottom: 20px; align-items: center; }
    .btn { background: #0f172a; color: white; padding: 10px 20px; border-radius: 9999px; text-decoration: none; font-size: 13.5px; font-weight: 700; border: none; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 6px; }
    .btn:hover { background: #2563eb; transform: translateY(-2px); }
    .btn-green { background: #10b981; }
    .btn-green:hover { background: #059669; }
    .svg-wrapper { background: white; border-radius: 24px; box-shadow: 0 20px 45px rgba(0,0,0,0.08); padding: 24px; max-width: 1200px; width: 100%; }
    svg { width: 100%; height: auto; }
  </style>
</head>
<body>
  <div class="toolbar">
    <span style="font-weight: 800; font-size: 15px; color: #0f172a;">🗺️ Sơ đồ Quy trình AI Agent CRM Minh An</span>
    <a href="/workflow_diagram.svg" download="Sodo_Quytrinh_MinhAn_CRM.svg" class="btn btn-green">
      📥 Tải Ảnh Vector (SVG)
    </a>
    <button onclick="window.print()" class="btn">
      🖨️ In Sơ Đồ / Lưu PDF
    </button>
    <a href="/" class="btn" style="background:#475569;">
      ⬅️ Về Dashboard
    </a>
  </div>

  <div class="svg-wrapper" id="svg-container">
    <!-- Embed SVG content -->
  </div>

  <script>
    fetch('/workflow_diagram.svg')
      .then(res => res.text())
      .then(svgText => {
        document.getElementById('svg-container').innerHTML = svgText;
      });
  </script>
</body>
</html>
